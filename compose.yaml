# ~/docker/ntfy/compose.yaml
services:
  ntfy:
    image: binwiederhier/ntfy:v2.11.0   # aktuelles Release auf Docker Hub prüfen
    container_name: ntfy
    command: serve
    user: "1000:1000"                   # = ubu, damit ./cache und ./etc beschreibbar sind
    volumes:
      - ./etc:/etc/ntfy
      - ./cache:/var/cache/ntfy
    networks:
      - webserver
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  webserver:
    external: true                      # wird vom webserver-Stack angelegt
