# ~/docker/ntfy/compose.yaml
services:
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: ntfy
    command: serve
    user: "1000:1000"
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-?NO BASEURL SET}
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 72h
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
      NTFY_ATTACHMENT_TOTAL_SIZE_LIMIT: 1G
      NTFY_ATTACHMENT_FILE_SIZE_LIMIT: 15M
      NTFY_ATTACHMENT_EXPIRY_DURATION: 24h
      NTFY_AUTH_FILE: /var/cache/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
      NTFY_ENABLE_SIGNUP: "false"
      NTFY_WEB_ROOT: /
    volumes:
      - ./cache:/var/cache/ntfy
    networks:
      - webserver
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  webserver:
    external: true
